<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7EC8F2">
<title>유치원 등원 준비 대시보드</title>
<style>
:root{
  --ink:#222B38; --ink-soft:#4a5768;
  --sky1:#7EC8F2; --sky2:#B8E6FE; --cream:#FBFBEF;
  --green:#2E9E4F; --green-d:#1E7C35; --green-l:#E8F8EC;
  --yellow:#FACC15; --yellow-l:#FFF3C4;
  --red:#E94B4B; --orange:#F08A2C;
  --bw:3px;            /* 굵은 다크 테두리 */
  --r:20px;
  --hard:0 5px 0 rgba(34,43,56,.16), 0 9px 18px rgba(34,43,56,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  color:var(--ink);overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%, #9BD6F7 10%, var(--sky2) 22%, #DFF2FD 27%, var(--cream) 34%, var(--cream) 100%);
}
/* ── 하늘 구름 ─────────────────────────── */
#sky{position:fixed;inset:0 0 auto 0;height:52%;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:210px;height:52px;left:6%;top:22px}
.c1::before{width:78px;height:78px;left:26px;top:-38px}
.c1::after{width:56px;height:56px;left:104px;top:-26px}
.c2{width:150px;height:40px;left:15%;top:0;opacity:.75}
.c2::before{width:58px;height:58px;left:20px;top:-28px}
.c2::after{width:42px;height:42px;left:78px;top:-18px}
.c3{width:240px;height:56px;right:4%;top:10px;opacity:.85}
.c3::before{width:86px;height:86px;left:34px;top:-42px}
.c3::after{width:60px;height:60px;left:126px;top:-28px}
.c4{width:130px;height:34px;right:26%;top:118px;opacity:.7}
.c4::before{width:50px;height:50px;left:18px;top:-24px}
.c4::after{width:36px;height:36px;left:70px;top:-14px}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 16px 12px}
.card{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--hard)}
.hidden{display:none !important}

/* ── 상단 (하늘 위) ────────────────────── */
header{display:flex;gap:12px;height:150px;flex:0 0 auto;align-items:stretch}

/* 좌: 도감 버튼 + EXP */
#hl{width:252px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:8px}
.hl-top{display:flex;align-items:center;gap:8px}
.dex-btn{display:flex;align-items:center;gap:8px;font-family:inherit;cursor:pointer;
  background:#fff;border:var(--bw) solid var(--ink);border-radius:14px;padding:6px 12px 6px 8px;
  font-weight:900;font-size:15px;color:var(--ink);box-shadow:0 4px 0 rgba(34,43,56,.20);transition:.12s}
.dex-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(34,43,56,.2)}
.dex-btn.active{background:var(--yellow-l)}
.pokeball{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);position:relative;flex:0 0 auto;
  background:linear-gradient(180deg,var(--red) 0 46%,var(--ink) 46% 55%,#fff 55% 100%)}
.pokeball::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);
  background:#fff;border:3px solid var(--ink);border-radius:50%}
.pokeball.sm{width:22px;height:22px;border-width:2.5px}
.pokeball.sm::after{width:7px;height:7px;border-width:2.5px}
.hl-icons{display:flex;gap:6px;margin-left:auto}
.icon-btn{width:40px;height:40px;font-family:inherit;font-size:18px;cursor:pointer;background:#fff;
  border:var(--bw) solid var(--ink);border-radius:12px;box-shadow:0 4px 0 rgba(34,43,56,.20);transition:.12s}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(34,43,56,.2)}

.exp-mini{display:flex;align-items:center;gap:8px;background:#fff;border:var(--bw) solid var(--ink);
  border-radius:16px;padding:6px 10px;box-shadow:0 4px 0 rgba(34,43,56,.18)}
#today-poke-img{width:42px;height:42px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.exp-info{flex:1;min-width:0}
#today-poke-name{font-size:13px;font-weight:900;line-height:1.1}
#exp-text{font-size:10px;font-weight:800;color:var(--ink-soft);margin:1px 0 3px}
.bar{height:10px;background:#EDEBE3;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.bar>div{height:100%;width:0%;background:linear-gradient(180deg,#FFD34D,#F0A81E);border-radius:99px;transition:width .5s}

/* 중앙: 날짜 + 디지털 시계 */
#hc{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
#date-line{font-size:16px;font-weight:900;color:#fff;letter-spacing:-.2px;
  text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),
              -2px 0 0 var(--ink),2px 0 0 var(--ink),0 -2px 0 var(--ink),0 2px 0 var(--ink),0 4px 0 rgba(34,43,56,.35)}
#clock{display:flex;align-items:flex-end;gap:8px}
#clock .ap{font-size:19px;font-weight:900;color:#fff;margin-bottom:13px;line-height:1;
  text-shadow:-2.5px -2.5px 0 var(--ink),2.5px -2.5px 0 var(--ink),-2.5px 2.5px 0 var(--ink),2.5px 2.5px 0 var(--ink),
              -2.5px 0 0 var(--ink),2.5px 0 0 var(--ink),0 -2.5px 0 var(--ink),0 2.5px 0 var(--ink),0 5px 0 rgba(34,43,56,.3)}
#clock .d{position:relative;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;color:#fff;
  font-size:66px;line-height:.86;letter-spacing:-2px;z-index:0;
  text-shadow:-2px 6px 0 rgba(34,43,56,.22),0 9px 0 rgba(34,43,56,.18)}
#clock .d::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;color:#fff;
  -webkit-text-stroke:11px var(--ink)}
#clock .colon{position:relative;font-family:"Arial Black",Arial,sans-serif;font-weight:900;color:#fff;font-size:58px;line-height:.86;z-index:0}
#clock .colon::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;color:#fff;-webkit-text-stroke:10px var(--ink)}

/* 우: 날씨 박스 */
#weather-card{width:508px;flex:0 0 auto;display:flex;flex-direction:column;gap:4px;padding:8px 10px 6px;border-radius:18px}
.w-main{display:flex;align-items:center;gap:8px;flex:1;min-height:0}
#dust-chips{flex:0 0 auto;display:flex;width:60px}
.dust-badge{flex:0 0 auto;width:60px;height:96px;border:var(--bw) solid var(--ink);border-radius:12px;background:#8FD6A2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;box-shadow:0 3px 0 rgba(34,43,56,.18)}
.dust-badge .db-t{font-size:10px;font-weight:900;letter-spacing:-.4px;white-space:nowrap}
.dust-badge .db-face{font-size:20px;line-height:1}
.dust-badge .db-g{font-size:15px;font-weight:900;letter-spacing:-.5px}
.dust-badge .db-v{font-size:10.5px;font-weight:800;opacity:.95}
.dust-badge.d-good{background:#45B36B}
.dust-badge.d-mod{background:#3E8FD8}
.dust-badge.d-bad{background:#F0A81E;color:#4a3400}
.dust-badge.d-bad .db-v,.dust-badge.d-bad .db-t{color:#4a3400}
.dust-badge.d-vbad{background:#E05555}

.w-mid{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
#w-icon{font-size:40px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 2px 2px rgba(34,43,56,.15))}
.w-temps{min-width:0}
#w-temp{font-size:34px;font-weight:900;line-height:1;letter-spacing:-1px}
#w-desc{font-size:12.5px;font-weight:900;color:var(--ink);margin-top:1px}
#w-minmax{font-size:10.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
#w-dustline{font-size:10.5px;font-weight:800;color:var(--ink-soft);white-space:nowrap;margin-top:1px}

.w-hours{flex:0 0 auto;display:flex;gap:5px}
.wh-chip{flex:0 0 auto;width:49px;border:2.5px solid var(--ink);border-radius:10px;background:#EAF7FF;text-align:center;
  padding:3px 0 2px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 2px 0 rgba(34,43,56,.15)}
.wh-h{font-size:9.5px;font-weight:900;color:var(--ink-soft)}
.wh-i{font-size:15px;line-height:1.05}
.wh-t{font-size:12px;font-weight:900;line-height:1.15}
.wh-p{font-size:8.5px;font-weight:800;color:#2F6FB5;line-height:1.2}

#w-tip-row{flex:0 0 auto;display:flex;align-items:center;gap:6px;border-top:2px dashed #D9DEE8;padding-top:3px}
#w-tip{font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;line-height:1.25}
#w-err{flex:0 0 auto;font-size:10px;color:#b34820;font-weight:800;white-space:nowrap}
#w-retry{font-family:inherit;font-size:11px;font-weight:900;color:#1d5cad;background:#E3F0FD;
  border:2px solid var(--ink);border-radius:9px;padding:1px 8px;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 0 rgba(34,43,56,.2);line-height:1.3}
#w-retry:active{transform:translateY(2px);box-shadow:none}
#w-naver{flex:0 0 auto;margin-left:auto;font-size:10px;font-weight:800;color:var(--ink-soft);text-decoration:none;
  border:2px solid #D9DEE8;border-radius:8px;padding:0 5px;white-space:nowrap;line-height:1.35;background:#F7FAFF}
#w-naver:active{background:#E3F0FD}
.dust-badge.d-unk{background:#AEB8C6}

/* ── 진행 바 ───────────────────────────── */
#progress-card{height:112px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;border-radius:18px}
#p-left{flex:0 0 auto;width:250px}
#p-title{line-height:1.1}
#p-title .lbl{display:block;font-size:12.5px;font-weight:900;color:var(--ink-soft);letter-spacing:-.2px}
#p-title b{display:block;font-size:29px;font-weight:900;color:var(--green);letter-spacing:-1px;margin-top:1px}
#p-title b.late{color:#E05555;font-size:26px}
#p-title b.sleep{color:#5A6B7E;font-size:25px}
#p-sub{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:2px}
#p-bar-wrap{flex:1;min-width:0;position:relative;padding-top:12px}
#p-bar{position:relative;height:30px;background:#EDEBE3;border:var(--bw) solid var(--ink);border-radius:99px;box-shadow:inset 0 3px 0 rgba(34,43,56,.08)}
#p-fill{position:absolute;inset:3px auto 3px 3px;width:0%;border-radius:99px;background:linear-gradient(180deg,#4CC772,#2E9E4F 60%,#23823F);transition:width .8s;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
#p-poke{position:absolute;bottom:24px;width:64px;height:64px;transform:translateX(-50%);left:0%;transition:left .8s;filter:drop-shadow(0 3px 2px rgba(34,43,56,.25));z-index:3}
#p-bubble{position:absolute;left:48%;top:-6px;transform:translateX(-50%);background:#fff;border:2.5px solid var(--ink);
  border-radius:12px;padding:3px 10px;font-size:12.5px;font-weight:900;white-space:nowrap;z-index:4;
  box-shadow:0 3px 0 rgba(34,43,56,.2)}
#p-bubble::after{content:"";position:absolute;left:18px;bottom:-8px;width:11px;height:11px;background:#fff;
  border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
#p-labels{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;font-weight:800;color:var(--ink-soft);margin-top:3px;padding:0 2px}
#p-msg{flex:1;text-align:center;font-size:10.5px;font-weight:900;color:var(--green-d)}
#p-school{flex:0 0 auto;font-size:44px;line-height:1;filter:drop-shadow(0 3px 2px rgba(34,43,56,.2))}

/* ── 할 일 카드 ────────────────────────── */
#view-dash{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.task{position:relative;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--hard);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 6px 6px;cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s;user-select:none;overflow:hidden}
.task:active{transform:scale(.975)}
.task .num{position:absolute;top:7px;left:8px;width:32px;height:32px;border-radius:50%;background:#fff;
  border:var(--bw) solid var(--ink);color:var(--ink);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:3;
  box-shadow:0 2px 0 rgba(34,43,56,.18)}
.task .active-bubble{position:absolute;top:10px;left:46px;background:var(--yellow);border:2.5px solid var(--ink);
  border-radius:11px;padding:2px 9px;font-size:12.5px;font-weight:900;color:#3d2f00;display:none;z-index:3;
  box-shadow:0 3px 0 rgba(34,43,56,.2);white-space:nowrap}
.task.active .active-bubble{display:block}
.poke-mini{position:absolute;top:6px;right:6px;width:46px;height:46px;object-fit:contain;display:none;z-index:2;
  filter:drop-shadow(0 2px 2px rgba(34,43,56,.2))}
.task.active .poke-mini{display:block}
.task .task-img{flex:1 1 auto;min-height:0;width:100%;max-height:332px;height:100%;object-fit:cover;object-position:center 45%;pointer-events:none;
  mix-blend-mode:multiply}
.task .t-label{flex:0 0 auto;font-size:17px;font-weight:900;text-align:center;line-height:1.15;padding:4px 0 2px;letter-spacing:-.4px}
.task.active{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(250,204,21,.35),0 6px 0 rgba(34,43,56,.14),0 10px 22px rgba(34,43,56,.12)}
.task.done{border-color:var(--green);background:var(--green-l)}
.task .check{position:absolute;top:6px;right:8px;width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;
  border:2.5px solid var(--ink);font-size:17px;display:none;align-items:center;justify-content:center;font-weight:900;z-index:4}
.task .done-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);background:var(--green);color:#fff;
  border:var(--bw) solid var(--ink);font-weight:900;font-size:19px;padding:4px 16px;border-radius:99px;display:none;
  box-shadow:0 4px 0 rgba(34,43,56,.2);pointer-events:none;z-index:4}
.task.done .check,.task.done .done-badge{display:flex}
.task.done .task-img{opacity:.45}
.task.done .active-bubble,.task.done .poke-mini{display:none}

/* 밥 먹기 타이머 */
.timer{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;margin:2px 0 1px;
  background:var(--yellow-l);border:2.5px solid var(--ink);border-radius:13px;padding:4px 6px 5px;width:96%;cursor:default;
  box-shadow:0 3px 0 rgba(34,43,56,.15)}
.timer.on{background:#DDF6E4}
#t-time{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.5px;color:#6b4f06;line-height:1.02}
.timer.on #t-time{color:var(--green-d)}
#t-time.ended{color:#d33;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.t-btns{display:flex;gap:4px;justify-content:center}
.t-btns button{font-family:inherit;font-weight:900;font-size:12px;border:2.5px solid var(--ink);border-radius:9px;
  padding:2px 8px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 rgba(34,43,56,.2);transition:.1s}
.t-btns button:active{transform:translateY(2px);box-shadow:none}
#t-start{background:var(--green);color:#fff}
#t-start.paused{background:var(--orange);color:#fff}
#t-reset{background:#fff;color:var(--ink)}
#t-end{background:#FFE2D6;color:#A63D12}

/* ── 도감 ──────────────────────────────── */
#view-poke{flex:1;min-height:0;overflow:auto;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);
  box-shadow:var(--hard);padding:12px 16px 14px}
#pk-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
#pk-head b{font-size:22px;font-weight:900;letter-spacing:-.4px}
#pk-stats{font-size:13px;color:var(--ink-soft);font-weight:800}
.back-btn{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:inherit;cursor:pointer;background:var(--yellow);
  border:var(--bw) solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:900;font-size:13.5px;color:var(--ink);
  box-shadow:0 4px 0 rgba(34,43,56,.2)}
.back-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(34,43,56,.2)}
#pk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pk-card{position:relative;border:2.5px solid #D7DEE9;border-radius:14px;background:#F7FAFF;padding:6px 6px 8px;text-align:center}
.pk-card.caught{border-color:var(--yellow);background:#FFFCEF;box-shadow:0 3px 0 rgba(34,43,56,.12)}
.pk-no{font-size:11px;font-weight:900;color:var(--ink-soft)}
.pk-card img{width:64%;max-width:96px;aspect-ratio:1;object-fit:contain}
.pk-card:not(.caught) img{filter:brightness(0);opacity:.22}
.pk-name{font-weight:900;font-size:15px;letter-spacing:-.3px}
.pk-card:not(.caught) .pk-name{color:#AEB8C6}
.pk-date{font-size:10.5px;color:#B78A12;font-weight:800;min-height:1.3em}
.pk-cnt{position:absolute;top:5px;right:7px;background:var(--yellow);border:2px solid var(--ink);color:#3d2f00;border-radius:99px;font-weight:900;font-size:10px;padding:0 7px}

/* ── 모달 ──────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(24,32,44,.5);display:flex;align-items:center;justify-content:center;z-index:50}
#modal-catch{z-index:60}
.modal{background:#fff;border:var(--bw) solid var(--ink);border-radius:22px;box-shadow:0 14px 0 rgba(34,43,56,.18);padding:18px 26px;
  max-width:min(88vw,520px);max-height:88vh;overflow:auto;text-align:center}
#modal-catch .m-sprite{width:150px;height:150px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
#modal-catch h2{font-size:30px;color:#E0731D;margin:4px 0 2px;font-weight:900}
#catch-name{font-size:21px;font-weight:900}
#catch-sub{font-size:14px;color:var(--ink-soft);font-weight:800;margin:4px 0 12px}
.m-btn{font-family:inherit;font-weight:900;font-size:17px;border:var(--bw) solid var(--ink);border-radius:12px;padding:8px 26px;cursor:pointer;
  background:var(--green);color:#fff;box-shadow:0 4px 0 rgba(34,43,56,.25)}
#catch-ball{font-size:42px;animation:spin 1.2s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.modal h3{font-size:20px;margin-bottom:10px;text-align:left;font-weight:900}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:2px dashed #E4E9F1;font-size:14px;font-weight:800}
.set-row:last-child{border-bottom:none}
.set-row input[type=time]{font-family:inherit;font-size:14px;padding:3px 6px;border:2.5px solid var(--ink);border-radius:8px;font-weight:800}
.set-btn{font-family:inherit;font-weight:900;font-size:13px;border:2.5px solid var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;
  box-shadow:0 3px 0 rgba(34,43,56,.2)}
.sb-sound{background:var(--yellow-l);color:#6b4f06}
.sb-test{background:#E3F0FD;color:#1d5cad}
.sb-reset{background:#FFE2D6;color:#A63D12}
.sb-close{background:var(--green);color:#fff}
.btn-col{display:flex;flex-direction:column;gap:7px}
</style>
</head>
<body>
<div id="sky"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span><span class="cloud c4"></span></div>

<div id="app">
  <header>
    <!-- 좌: 도감 + EXP -->
    <div id="hl">
      <div class="hl-top">
        <button class="dex-btn" id="tab-poke" title="포켓몬 도감 열기">
          <span class="pokeball"></span><span>포켓몬 도감</span>
        </button>
        <div class="hl-icons">
          <button class="icon-btn" id="btn-sound" title="소리 켜기">🔇</button>

<script>
'use strict';
/* ================= 데이터 ================= */
const POKEMON=[
  {id:1,  no:'001', name:'이상해씨'},
  {id:4,  no:'004', name:'파이리'},
  {id:7,  no:'007', name:'꼬부기'},
  {id:25, no:'025', name:'피카츄'},
  {id:39, no:'039', name:'푸린'},
  {id:52, no:'052', name:'냐옹이'},
  {id:131,no:'131', name:'라프라스'},
  {id:133,no:'133', name:'이브이'},
  {id:143,no:'143', name:'잠만보'},
  {id:151,no:'151', name:'뮤'}
];
const TASKS=[
  {n:1,label:'아침 할 일(화장실)'},
  {n:2,label:'가방 준비'},
  {n:3,label:'밥 먹기'},
  {n:4,label:'아침 공부'},
  {n:5,label:'양치하고 옷 입기'}
];
const EXP_PER_TASK=10, EXP_PER_CATCH=100, EAT_SECONDS=1200;
const SKEY='morningDashboard.v1';
const LAT=37.5712, LON=127.0545; // 서울 동대문구 답십리1동

function todayKey(d=new Date()){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function load(){
  try{const s=JSON.parse(localStorage.getItem(SKEY));
    if(s&&s.v===1)return s;
  }catch(e){}
  return {v:1,days:{},caught:[],settings:{wake:'06:45',depart:'08:10',sound:false}};
}
let S=load();
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function day(k){
  if(!S.days[k])S.days[k]={tasks:{},inTime:{},exp:0,chime:false,timer:{left:EAT_SECONDS,running:false,since:null,ended:false}};
  return S.days[k];
}

/* ================= 시계·진행 ================= */
const WEEK='일월화수목금토'.split('');
function parseHM(s){const[a,b]=s.split(':').map(Number);return{h:a,m:b};}
function dateWith(hm,d=new Date()){const x=new Date(d);x.setHours(hm.h,hm.m,0,0);return x;}
function ampmClock(d){
  const h=d.getHours(),m=d.getMinutes(),ap=h<12?'오전':'오후';let h12=h%12;if(h12===0)h12=12;
  return {ap,h12,m};
}
function renderClock(){
  const now=new Date(),c=ampmClock(now);
  document.getElementById('date-line').textContent=`${now.getMonth()+1}월 ${now.getDate()}일 ${WEEK[now.getDay()]}요일`;
  document.getElementById('clock').innerHTML=
    `<span class="ap">${c.ap}</span><span class="d" data-t="${c.h12}">${c.h12}</span><span class="colon" data-t=":">:</span><span class="d" data-t="${String(c.m).padStart(2,'0')}">${String(c.m).padStart(2,'0')}</span>`;
}
function renderProgress(){
  const now=new Date();
  const wake=dateWith(parseHM(S.settings.wake)), dep=dateWith(parseHM(S.settings.depart));
  if(dep<=wake){dep.setDate(dep.getDate()+1);}
  let pct,title,msg;
  const lbl='<span class="lbl">유치원 출발까지</span>';
  if(now<wake){pct=0;title=lbl+'<b class="sleep">기상 시간 전이에요 😴</b>';msg='잠옷 갈아입고 기분 좋게 시작해요!';}
  else if(now<dep){
    pct=(now-wake)/(dep-wake)*100;
    const leftMin=Math.max(0,Math.ceil((dep-now)/60000));
    title=lbl+`<b>${leftMin}분 남았어요</b>`;
    msg=pct<25?'출발 준비, 천천히 시작해 볼까요?':pct<50?'좋아요, 순조로워요!':pct<75?'조금만 더 힘내요!':'거의 다 왔어요, 서둘러 주세요!';
  }else{pct=100;title=lbl+'<b class="late">출발 시간이 지났어요!</b>';msg='늦었어도 괜찮아요, 힘차게 화이팅!';}
  document.getElementById('p-title').innerHTML=title;
  document.getElementById('p-msg').textContent=msg;
  document.getElementById('p-wake-label').textContent='기상 '+S.settings.wake;
  document.getElementById('p-depart-label').textContent='출발 '+S.settings.depart;
  document.getElementById('p-sub').textContent='출발 '+fmtK(S.settings.depart);
  document.getElementById('p-fill').style.width=pct+'%';
  const poke=nextTarget();
  const pp=document.getElementById('p-poke');
  if(!pp.getAttribute('src'))pp.src=`assets/pokemon/${poke.id}.png`;
  pp.style.left=pct+'%';
}
function fmtK(hm){const{h,m}=parseHM(hm),ap=h<12?'오전':'오후';let h12=h%12;if(h12===0)h12=12;return `${ap} ${h12}:${String(m).padStart(2,'0')}`;}

/* ================= EXP · 포획 ================= */
function poolExp(){let t=0;for(const k in S.days)t+=S.days[k].exp||0;return t-EXP_PER_CATCH*S.caught.length;}
function nextTarget(){
  const di=Math.floor(new Date(todayKey()+'T00:00:00')/864e5);
  for(let i=0;i<POKEMON.length;i++){const p=POKEMON[(di+i)%POKEMON.length];
    if(!S.caught.some(c=>c.id===p.id))return p;}
  return POKEMON[di%POKEMON.length]; // 도감 완료 후엔 순환
}
function renderExp(){
  const p=nextTarget(),pool=Math.max(0,poolExp());
  document.getElementById('today-poke-img').src=`assets/pokemon/${p.id}.png`;
  document.getElementById('today-poke-name').textContent='오늘 목표 · '+p.name;
  document.getElementById('exp-text').textContent=`${pool} / ${EXP_PER_CATCH} EXP`;
  document.getElementById('exp-fill').style.width=Math.min(100,pool)+'%';
  document.querySelectorAll('.poke-mini').forEach(i=>{i.src=`assets/pokemon/${p.id}.png`;i.alt=p.name;});
}
function checkCatch(){
  if(poolExp()>=EXP_PER_CATCH){
    const p=nextTarget();
    S.caught.push({id:p.id,date:todayKey()});
    save();
    showCatch(p);
    return true;
  }
  return false;
}
function showCatch(p){
  document.getElementById('modal-settings').classList.add('hidden');
  document.getElementById('catch-img').src=`assets/pokemon/${p.id}.png`;
  document.getElementById('catch-name').textContent=`No.${p.no} ${p.name}`;
  document.getElementById('catch-sub').textContent=`${todayKey().replace(/-/g,'.')} 획득 · 다음 목표: ${nextTarget().name}`;
  document.getElementById('modal-catch').classList.remove('hidden');
  playChime();
  renderExp();renderPoke();
}
document.getElementById('catch-close').addEventListener('click',()=>{
  document.getElementById('modal-catch').classList.add('hidden');
});

/* ================= 할 일 ================= */
function buildTasks(){
  const main=document.getElementById('view-dash');
  main.innerHTML='';
  TASKS.forEach(t=>{
    const el=document.createElement('div');
    el.className='task';el.id=`task-${t.n}`;el.dataset.n=t.n;
    let inner=`<div class="num">${t.n}</div>
      <div class="active-bubble">같이 하자!</div>
      <img class="poke-mini" src="" alt="오늘의 포켓몬">
      <img class="task-img" src="assets/task-${t.n}.png" alt="${t.label}">
      ${t.n===3?`<div class="timer" id="eat-timer">
        <div id="t-time">20:00</div>
        <div class="t-btns">
          <button id="t-start">▶ 시작</button>
          <button id="t-reset">⟳</button>
          <button id="t-end">⏹ 끝</button>
        </div>
      </div>`:''}
      <div class="t-label">${t.label}</div>
      <div class="check">✔</div><div class="done-badge">완료!</div>`;
    el.innerHTML=inner;
    el.addEventListener('click',()=>toggleTask(t.n));
    main.appendChild(el);
  });
  document.getElementById('t-start').addEventListener('click',e=>{e.stopPropagation();timerToggle();});
  document.getElementById('t-reset').addEventListener('click',e=>{e.stopPropagation();timerReset();});
  document.getElementById('t-end').addEventListener('click',e=>{e.stopPropagation();timerEnd();});
}
function isBeforeDepart(){
  const now=new Date(),dep=dateWith(parseHM(S.settings.depart));
  return now<dep;
}
function toggleTask(n,forceInTime){
  const d=day(todayKey());
  if(!d.tasks[n]){
    d.tasks[n]=true;
    d.inTime[n]=(typeof forceInTime==='boolean')?forceInTime:isBeforeDepart();
    if(d.inTime[n]){d.exp=(d.exp||0)+EXP_PER_TASK;}
  }else{
    if(d.inTime[n])d.exp=Math.max(0,(d.exp||0)-EXP_PER_TASK);
    delete d.tasks[n];delete d.inTime[n];
  }
  save();renderTasks();renderExp();
  checkCatch();
}
function renderTasks(){
  const d=day(todayKey());
  let taken=false;
  TASKS.forEach(t=>{
    const el=document.getElementById(`task-${t.n}`);
    const done=!!d.tasks[t.n];
    el.classList.toggle('done',done);
    const act=!done&&!taken;
    if(act)taken=true;
    el.classList.toggle('active',act);
  });
  renderTimer();
}
/* 밥 먹기 20분 타이머 */
function renderTimer(){
  const d=day(todayKey()).timer,left=Math.max(0,Math.ceil(d.left));
  const el=document.getElementById('eat-timer');if(!el)return;
  el.classList.toggle('on',!!d.running);
  const tEl=document.getElementById('t-time');
  tEl.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;
  tEl.classList.toggle('ended',d.left<=0);
  const s=document.getElementById('t-start');
  s.textContent=d.running?'⏸ 일시정지':'▶ 시작';
  s.classList.toggle('paused',!!d.running);
}
function timerToggle(){
  const t=day(todayKey()).timer;
  if(t.left<=0){t.left=EAT_SECONDS;t.ended=false;}
  if(t.running){t.left=Math.max(0,t.left-(Date.now()-t.since)/1000);t.running=false;t.since=null;}
  else{t.running=true;t.since=Date.now();}
  save();renderTimer();
}
function timerReset(){
  const d=day(todayKey());
  d.timer={left:EAT_SECONDS,running:false,since:null,ended:false};
  save();renderTimer();
}
function timerEnd(){
  const t=day(todayKey()).timer;
  if(t.running){t.left=Math.max(0,t.left-(Date.now()-t.since)/1000);}
  t.running=false;t.since=null;
  save();renderTimer();
}
function tickTimer(){
  const t=day(todayKey()).timer;
  if(t.running){
    const left=t.left-(Date.now()-t.since)/1000;
    if(left<=0){
      day(todayKey()).timer={left:0,running:false,since:null,ended:true};
      save();renderTimer();playBeep();
    }else{t.left=left;t.since=Date.now();save();renderTimer();}
  }
}

/* ================= 사운드 · TTS ================= */
let AC=null,soundUnlocked=false;
function unlockAudio(){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    soundUnlocked=true;S.settings.sound=true;save();updateSoundBtn();
    return true;
  }catch(e){return false;}
}
function playChime(){
  if(!soundUnlocked||!AC)return;
  try{
    const t=AC.currentTime;
    [[523.25,0],[659.25,.13],[783.99,.26],[1046.5,.4]].forEach(([f,dt])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='triangle';o.frequency.value=f;
      o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(0,t+dt);
      g.gain.linearRampToValueAtTime(.28,t+dt+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+dt+.55);
      o.start(t+dt);o.stop(t+dt+.6);
    });
  }catch(e){}
  try{
    if('speechSynthesis' in window){
      const u=new SpeechSynthesisUtterance('가랏, 피카츄!');
      u.lang='ko-KR';u.rate=1;u.pitch=1.2;
      speechSynthesis.speak(u);
    }
  }catch(e){}
}
function playBeep(){
  if(!soundUnlocked||!AC)return;
  try{
    const t=AC.currentTime;
    [0,.3].forEach(dt=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=880;
      o.connect(g);g.connect(AC.destination);
      g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(.2,t+dt+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+dt+.25);
      o.start(t+dt);o.stop(t+dt+.3);
    });
  }catch(e){}
}
function updateSoundBtn(){
  document.getElementById('btn-sound').textContent=soundUnlocked?'🔊':'🔇';
  const b=document.getElementById('btn-unlock');
  b.textContent=soundUnlocked?'🔊 소리 켜짐':'🔊 소리 켜기';
}

/* 08:10 출발 이벤트 (하루 1회) */
function checkDepartEvent(){
  const now=new Date(),d=day(todayKey());
  const dep=dateWith(parseHM(S.settings.depart));
  if(now>=dep&&!d.chime&&soundUnlocked){
    d.chime=true;save();
    playChime();
    document.getElementById('modal-catch').classList.add('hidden');
  }
}

/* ================= 날씨 (Open-Meteo 5초 타임아웃 → met.no 자동 폴백) ================= */
const WMO={0:['맑음','☀️'],1:['대체로 맑음','🌤️'],2:['구름 조금','⛅'],3:['흐림','☁️'],45:['안개','🌫️'],48:['안개','🌫️'],
  51:['이슬비','🌦️'],53:['이슬비','🌦️'],55:['이슬비','🌧️'],56:['얼어붙는 이슬비','🌧️'],57:['얼어붙는 이슬비','🌧️'],
  61:['비','🌧️'],63:['비','🌧️'],65:['강한 비','🌧️'],66:['얼어붙는 비','🌧️'],67:['얼어붙는 비','🌧️'],
  71:['눈','🌨️'],73:['눈','🌨️'],75:['많은 눈','❄️'],77:['진눈깨비','🌨️'],
  80:['소나기','🌦️'],81:['소나기','🌧️'],82:['강한 소나기','🌧️'],85:['소낙눈','🌨️'],86:['소낙눈','❄️'],
  95:['천둥번개','⛈️'],96:['천둥번개','⛈️'],99:['천둥번개','⛈️']};
/* met.no symbol_code → WMO 코드 (폴백에서 같은 표/팁 로직을 쓰기 위해) */
const MET_SYM={clearsky:0,fair:1,partlycloudy:2,cloudy:3,fog:45,
  lightrain:61,rain:63,heavyrain:65,lightrainshowers:80,rainshowers:81,heavyrainshowers:82,
  lightsleet:56,sleet:57,heavysleet:57,lightsnow:71,snow:73,heavysnow:75,
  lightsnowshowers:85,snowshowers:86,rainandthunder:95,heavyrainandthunder:99,lightrainandthunder:95,
  sleetandthunder:96,partlycloudyandthunder:95,cloudyandthunder:95,fairandthunder:95,clearskyandthunder:95};
const HOURS=[8,12,16,20];
const W_TIMEOUT=5000;                 /* 한 소스당 5초 */
const W_CACHE_KEY='morningDashboard.weather.v1';
const W_TTL=60*60*1000;               /* 마지막 성공 날씨 1시간 캐시 */
let W={},wBusy=false;

function metCode(sym){
  if(!sym)return 3;
  const base=String(sym).replace(/_(day|night|polartwilight)$/,'');
  return (base in MET_SYM)?MET_SYM[base]:3;
}
function getJSON(url,ms){
  const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  const tid=setTimeout(()=>{if(ctrl)ctrl.abort();},ms);
  return fetch(url,ctrl?{signal:ctrl.signal}:{}).then(r=>{
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  }).finally(()=>clearTimeout(tid));
}
/* ── 1) Open-Meteo (기본) ───────────────── */
async function fetchOpenMeteo(){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
    `&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min`+
    `&hourly=temperature_2m,precipitation_probability,weather_code&timezone=Asia%2FSeoul&forecast_days=1`;
  const w=await getJSON(u,W_TIMEOUT);
  if(!w||!w.current||!w.hourly||!w.hourly.time)throw new Error('open-meteo bad data');
  const day=new Date().getDate(),curH=new Date().getHours();
  const hours=[];
  HOURS.forEach(h=>{
    const i=w.hourly.time.findIndex(t=>{const d=new Date(t);return d.getHours()===h&&d.getDate()===day;});
    if(i<0)return;
    hours.push({h,t:w.hourly.temperature_2m[i],code:w.hourly.weather_code[i],p:(w.hourly.precipitation_probability||[])[i]||0});
  });
  const probs=[];
  w.hourly.time.forEach((t,i)=>{const h=new Date(t).getHours();if(h>=curH&&h<=20)probs.push((w.hourly.precipitation_probability||[])[i]||0);});
  return {temp:w.current.temperature_2m,code:w.current.weather_code,
    tmax:(w.daily.temperature_2m_max||[])[0],tmin:(w.daily.temperature_2m_min||[])[0],
    hours,probs,src:'open-meteo'};
}
/* ── 2) met.no (폴백, CORS 허용) ────────── */
async function fetchMetNo(){
  const u=`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${LAT}&lon=${LON}`;
  const d=await getJSON(u,W_TIMEOUT);
  const ts=(d&&d.properties&&d.properties.timeseries)||[];
  if(ts.length<2)throw new Error('met.no empty');
  const KST=9*3600*1000;
  const kd=iso=>new Date(new Date(iso).getTime()+KST);          /* UTC → KST */
  const key=x=>x.getUTCFullYear()+'-'+(x.getUTCMonth()+1)+'-'+x.getUTCDate();
  const nowMs=Date.now(),todayK=key(kd(new Date(nowMs).toISOString()));
  const amt=e=>{const d1=e.data.next_1_hours&&e.data.next_1_hours.details;return (d1&&d1.precipitation_amount)||0;};
  const prob=mm=>mm<=0?0:mm<0.5?40:mm<2?65:mm<5?85:95;         /* met.no compact엔 확률 필드가 없어 강수량으로 환산 */
  const symOf=e=>(e.data.next_1_hours&&e.data.next_1_hours.summary&&e.data.next_1_hours.summary.symbol_code)||
                 (e.data.next_6_hours&&e.data.next_6_hours.summary&&e.data.next_6_hours.summary.symbol_code)||'';
  let cur=ts[0],best=Infinity;
  ts.forEach(e=>{const df=Math.abs(new Date(e.time).getTime()-nowMs);if(df<best){best=df;cur=e;}});
  const todays=ts.filter(e=>key(kd(e.time))===todayK);
  const pool=todays.length>=4?todays:ts.filter(e=>{const t=new Date(e.time).getTime();return t>=nowMs-3600e3&&t<=nowMs+24*3600e3;});
  const temps=pool.map(e=>e.data.instant.details.air_temperature);
  const hours=[],probs=[],curH=Number(new Date(nowMs+KST).toISOString().slice(11,13));
  HOURS.forEach(h=>{
    const hit=todays.find(e=>kd(e.time).getUTCHours()===h);
    if(!hit)return;
    hours.push({h,t:hit.data.instant.details.air_temperature,code:metCode(symOf(hit)),p:prob(amt(hit))});
  });
  ts.forEach(e=>{const k=kd(e.time);if(key(k)!==todayK)return;const h=k.getUTCHours();if(h>=curH&&h<=20)probs.push(prob(amt(e)));});
  return {temp:cur.data.instant.details.air_temperature,code:metCode(symOf(cur)),
    tmax:Math.max.apply(null,temps),tmin:Math.min.apply(null,temps),
    hours,probs,src:'met.no'};
}
/* ── 3) 미세먼지 (날씨와 분리) ───────────── */
async function fetchDust(){
  const u=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}`+
    `&current=pm10,pm2_5&timezone=Asia%2FSeoul`;
  try{
    const a=await getJSON(u,W_TIMEOUT);
    const pm10=a&&a.current&&a.current.pm10,pm25=a&&a.current&&a.current.pm2_5;
    if(typeof pm10!=='number'||typeof pm25!=='number')throw new Error('no pm');
    W.air={pm10,pm25};W.airAt=Date.now();
  }catch(e){
    if(!W.airAt||Date.now()-W.airAt>W_TTL){W.air=null;}  /* 1시간 넘은 값이면 안전하게 '-' 표시 */
  }
  saveWeatherCache();
  if(W.at)renderWeather();
}
/* ── 캐시 ───────────────────────────────── */
function readWeatherCache(){
  try{
    const c=JSON.parse(localStorage.getItem(W_CACHE_KEY));
    if(c&&c.at&&Array.isArray(c.hours)&&Date.now()-c.at<W_TTL)return c;
  }catch(e){}
  return null;
}
function saveWeatherCache(){
  if(!W.at)return;
  try{localStorage.setItem(W_CACHE_KEY,JSON.stringify(W));}catch(e){}
}
/* ── 상태 표시 ──────────────────────────── */
function showRetry(on){
  const box=document.getElementById('w-err');
  box.classList.toggle('hidden',!on);
  if(on&&!document.getElementById('w-retry')){
    box.innerHTML='<button id="w-retry" type="button">🔄 다시 불러오기</button>';
    document.getElementById('w-retry').addEventListener('click',e=>{e.stopPropagation();refreshWeather();});
  }
  const tip=document.getElementById('w-tip');
  tip.classList.toggle('hidden',on&&!W.at);
  fitTip();
}
function renderFail(){
  showRetry(true);
  if(W.at){renderWeather();return;}   /* 캐시·이전 값이 있으면 그대로 두고 버튼만 */
  if(!W.at){
    document.getElementById('w-temp').textContent='--°';
    document.getElementById('w-desc').textContent='날씨를 못 가져왔어요';
    document.getElementById('w-minmax').textContent='아래 버튼을 눌러 다시 시도해 주세요';
    document.getElementById('w-dustline').textContent='미세 - · 초미세 - ㎍';
    document.getElementById('dust-chips').innerHTML=
      `<div class="dust-badge d-unk"><span class="db-t">미세먼지</span><span class="db-face">⏳</span><span class="db-g">-</span><span class="db-v">-</span></div>`;
    document.getElementById('w-hours').innerHTML='';
    document.getElementById('w-icon').textContent='🌥️';
    document.getElementById('w-tip').textContent='';
  }
}
/* ── 불러오기 (독립 실행) ────────────────── */
async function refreshWeather(){
  if(wBusy)return;
  wBusy=true;
  showRetry(false);
  if(!W.at){
    document.getElementById('w-icon').textContent='⏳';
    document.getElementById('w-temp').textContent='--°';
    document.getElementById('w-desc').textContent='날씨 확인 중';
  }
  let ok=false;
  fetchDust();                    /* 날씨와 동시에, 서로 기다리지 않음 */
  try{
    const w=await fetchOpenMeteo();
    W=Object.assign(W,w,{at:Date.now()});
    ok=true;
  }catch(e){
    document.getElementById('w-desc').textContent='날씨 다시 확인 중';
    try{
      const w=await fetchMetNo();
      W=Object.assign(W,w,{at:Date.now()});
      ok=true;
    }catch(e2){ok=false;}
  }
  if(ok){saveWeatherCache();renderWeather();}
  else renderFail();
  wBusy=false;
}
function initWeather(){
  const c=readWeatherCache();
  if(c){W=c;renderWeather();}
  refreshWeather();
}
function dustGrade(pm,p25){
  const g1=pm<=30?['좋음','d-good']:pm<=80?['보통','d-mod']:pm<=150?['나쁨','d-bad']:['매우나쁨','d-vbad'];
  const g2=p25<=15?['좋음','d-good']:p25<=35?['보통','d-mod']:p25<=75?['나쁨','d-bad']:['매우나쁨','d-vbad'];
  return {pm10:g1,pm25:g2};
}
function round1(x){return Math.round(x);}
const DUST_FACE={'좋음':'😄','보통':'🙂','나쁨':'😷','매우나쁨':'🤢'};
function renderWeather(){
  if(!W.at)return;
  const [desc,icon]=WMO[W.code]||['알 수 없음','🌡️'];
  document.getElementById('w-icon').textContent=icon;
  document.getElementById('w-temp').textContent=round1(W.temp)+'°';
  document.getElementById('w-desc').textContent=desc;
  document.getElementById('w-minmax').textContent=
    (typeof W.tmax==='number'&&typeof W.tmin==='number')?`최고 ${round1(W.tmax)}° · 최저 ${round1(W.tmin)}°`:'';
  /* 시간대별 예보: 8/12/16/20시 */
  const hours=document.getElementById('w-hours');hours.innerHTML='';
  (W.hours||[]).forEach(o=>{
    const [hd,hi]=WMO[o.code]||['','🌡️'];
    const chip=document.createElement('div');chip.className='wh-chip';
    chip.innerHTML=`<div class="wh-h">${o.h}시</div><div class="wh-i">${hi}</div>
      <div class="wh-t">${round1(o.t)}°</div>
      <div class="wh-p">💧${o.p??0}%</div>`;
    hours.appendChild(chip);
  });
  /* 미세먼지: 세로 배지 (실패하면 안전 표시) */
  const air=(W.air&&typeof W.air.pm10==='number'&&typeof W.air.pm25==='number')?W.air:null;
  let g=null;
  const dustBox=document.getElementById('dust-chips');
  if(air){
    g=dustGrade(air.pm10,air.pm25);
    const RANK={'좋음':0,'보통':1,'나쁨':2,'매우나쁨':3};
    const worse=(RANK[g.pm25[0]]>RANK[g.pm10[0]])?g.pm25:g.pm10;
    dustBox.innerHTML=
      `<div class="dust-badge ${worse[1]}">
         <span class="db-t">미세먼지</span>
         <span class="db-face">${DUST_FACE[worse[0]]||'🙂'}</span>
         <span class="db-g">${worse[0]}</span>
         <span class="db-v">${round1(air.pm10)}㎍</span>
       </div>`;
    document.getElementById('w-dustline').textContent=`미세 ${round1(air.pm10)} · 초미세 ${round1(air.pm25)} ㎍`;
  }else{
    dustBox.innerHTML=
      `<div class="dust-badge d-unk">
         <span class="db-t">미세먼지</span>
         <span class="db-face">⏳</span>
         <span class="db-g">-</span>
         <span class="db-v">-</span>
       </div>`;
    document.getElementById('w-dustline').textContent='미세 - · 초미세 - ㎍';
  }
  /* 외출 팁 (한 줄, 잘리지 않게) */
  const tips=[];
  const pmax=Math.max(0,...(W.probs||[]));
  const rainSoon=(W.code>=51&&W.code!==77)||pmax>=40;
  if(rainSoon)tips.push('☂️ 우산 챙기기');
  if(W.tmin<=5)tips.push('🧤 장갑·목도리 챙기기');
  if(W.tmax-W.tmin>=10||W.tmax<=15)tips.push('🧥 겉옷 챙기기');
  if(g&&(g.pm10[0]==='나쁨'||g.pm10[0]==='매우나쁨'||g.pm25[0]==='나쁨'||g.pm25[0]==='매우나쁨'))tips.push('😷 마스크 챙기기');
  const tipEl=document.getElementById('w-tip');
  tipEl.textContent=tips.length?('나갈 때: '+tips.join(' · ')):'나갈 때: 쾌적한 하루예요!';
  tipEl.classList.remove('hidden');
  fitTip();
}
function fitTip(){
  const el=document.getElementById('w-tip');
  const row=el.parentElement;
  const nav=document.getElementById('w-naver');
  const err=document.getElementById('w-err');
  let used=0;
  if(nav)used+=nav.offsetWidth+6;
  if(err&&!err.classList.contains('hidden'))used+=err.offsetWidth+6;
  const avail=row.clientWidth-8-used;
  let fs=12.4;el.style.fontSize=fs+'px';
  let guard=0;
  while(el.scrollWidth>avail&&fs>7.5&&guard++<40){fs-=0.3;el.style.fontSize=fs.toFixed(1)+'px';}
}

/* ================= 도감 ================= */
function renderPoke(){
  const grid=document.getElementById('pk-grid');grid.innerHTML='';
  let cnt=0;
  POKEMON.forEach(p=>{
    const got=S.caught.filter(c=>c.id===p.id);
    const last=got.length?got[got.length-1].date.replace(/-/g,'.'):'';
    cnt+=got.length;
    const card=document.createElement('div');
    card.className='pk-card'+(got.length?' caught':'');
    card.innerHTML=`<div class="pk-no">No.${p.no}</div>
      <img src="assets/pokemon/${p.id}.png" alt="${p.name}">
      <div class="pk-name">${got.length?p.name:'???'}</div>
      <div class="pk-date">${got.length?'잡은 날 '+last:'아직 못 잡았어요'}</div>
      ${got.length>1?`<div class="pk-cnt">×${got.length}</div>`:''}`;
    grid.appendChild(card);
  });
  document.getElementById('pk-stats').textContent=
    `잡은 포켓몬 ${cnt}마리 · 도감 ${S.caught.length?new Set(S.caught.map(c=>c.id)).size:0}/${POKEMON.length}종`;
}

/* ================= 탭 · 설정 ================= */
function switchTab(poke){
  document.getElementById('view-dash').classList.toggle('hidden',poke);
  document.getElementById('view-poke').classList.toggle('hidden',!poke);
  document.getElementById('tab-poke').classList.toggle('active',poke);
  if(poke)renderPoke();
}
document.getElementById('tab-dash').addEventListener('click',()=>switchTab(false));
document.getElementById('tab-poke').addEventListener('click',()=>switchTab(true));
document.getElementById('btn-sound').addEventListener('click',unlockAudio);

const setModal=document.getElementById('modal-settings');
document.getElementById('btn-settings').addEventListener('click',()=>{
  document.getElementById('set-wake').value=S.settings.wake;
  document.getElementById('set-depart').value=S.settings.depart;
  setModal.classList.remove('hidden');
});
document.getElementById('set-wake').addEventListener('change',e=>{if(e.target.value){S.settings.wake=e.target.value;save();renderProgress();}});
document.getElementById('set-depart').addEventListener('change',e=>{if(e.target.value){S.settings.depart=e.target.value;save();renderProgress();}});
document.getElementById('btn-unlock').addEventListener('click',()=>{unlockAudio();});
document.getElementById('btn-preview').addEventListener('click',()=>{if(!soundUnlocked)unlockAudio();playChime();});
document.getElementById('btn-test').addEventListener('click',()=>{
  const d=day(todayKey());
  TASKS.forEach(t=>{if(!d.tasks[t.n]){d.tasks[t.n]=true;d.inTime[t.n]=true;d.exp=(d.exp||0)+EXP_PER_TASK;}});
  save();renderTasks();renderExp();
  if(!checkCatch())alert('할 일 5개 완료! +50 EXP');
});
document.getElementById('btn-exp').addEventListener('click',()=>{
  const d=day(todayKey());d.exp=(d.exp||0)+50;save();renderTasks();renderExp();
  if(!checkCatch())alert('+50 EXP! (100이 되면 포획 연출이 나와요)');
});
document.getElementById('btn-reset-day').addEventListener('click',()=>{
  if(confirm('오늘 기록(할 일·EXP·타이머·출발 알림)을 초기화할까요?')){
    S.days[todayKey()]={tasks:{},inTime:{},exp:0,chime:false,timer:{left:EAT_SECONDS,running:false,since:null,ended:false}};
    save();renderTasks();renderExp();renderProgress();
    setModal.classList.add('hidden');
  }
});
document.getElementById('btn-reset-dex').addEventListener('click',()=>{
  if(confirm('잡은 포켓몬 도감을 모두 지울까요?')){
    S.caught=[];save();renderPoke();renderExp();
  }
});
document.getElementById('btn-close-settings').addEventListener('click',()=>setModal.classList.add('hidden'));
setModal.addEventListener('click',e=>{if(e.target===setModal)setModal.classList.add('hidden')});
window.addEventListener('resize',()=>{if(W.at)fitTip();});

/* ================= 시작 ================= */
buildTasks();
renderClock();renderProgress();renderTasks();renderExp();renderPoke();updateSoundBtn();
initWeather();
setInterval(refreshWeather,10*60*1000); /* 10분마다 자동 갱신 */
if(S.settings.sound)unlockAudio(); /* 이전에 소리를 켰던 기기 */
setInterval(renderClock,1000);
setInterval(tickTimer,500);
setInterval(()=>{renderProgress();checkDepartEvent();},5000);
checkDepartEvent();
</script>
